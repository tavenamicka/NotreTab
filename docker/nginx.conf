server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy vers json-server — nginx strip le préfixe /api (trailing slash)
    # Équivalent du rewrite Vite : path.replace(/^\/api/, '')
    location /api/ {
        proxy_pass http://notretab-api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Cache long terme pour les assets hashés (JS/CSS/fonts/images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — toutes les routes React vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
